name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pin the RC while 1.37 is in prerelease. Switch to ["1.37.0", "latest"]
        # after stable publication; latest currently resolves to 1.36.1.
        sema-version: ["1.37.0-rc.2"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Sema
        uses: sema-lisp/setup-sema@v1
        with:
          sema-version: ${{ matrix.sema-version }}

      - name: Run tests
        run: sema test.sema
